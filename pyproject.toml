[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shlepaflash-cli"
version = "1.0.6"
description = "ShlepaFlash CLI — cross-platform terminal flasher for ESP32 devices"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ShlepaFlash"}]
dependencies = [
  "textual>=0.86.0,<2.0.0",
  "rich>=13.7.0",
  "requests>=2.31.0",
  "platformdirs>=4.2.0",
  "pyserial>=3.5",
  "esptool>=4.7.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
sflasher = "sflasher_cli.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sflasher_cli*"]

[tool.setuptools.package-data]
sflasher_cli = ["ui/*.tcss", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
